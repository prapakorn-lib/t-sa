version: '3.8'

services:
  # Frontend Service (Tier 1)
  web:
    build: ./app
    container_name: concert-web
    ports:
      - "8347:8347"
    environment:
      - PORT=8347
      - DB_HOST=db
      - DB_PORT=54321
      - DB_NAME=concert_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - BUILD_ID=BLD-2024-X9K7M3
      - DEPLOY_ENV=exam-production
      - APP_VERSION=2.4.7
      - SESSION_SECRET=sk_prod_9x8c7v6b5n4m3k2j1h0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - concert-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8347/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Database Service (Tier 2)
  db:
    image: postgres:15-alpine
    container_name: concert-db
    environment:
      - POSTGRES_DB=concert_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - PGPORT=54321
      - DB_INSTANCE_ID=PGDB-X7M9K4N2
      - DB_CLUSTER=exam-cluster-01
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "54321:54321"
    restart: unless-stopped
    networks:
      - concert-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 54321"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: -p 54321

  # Test Runner Service (สำหรับรันการทดสอบ - Optional)
  test-runner:
    build:
      context: .
      dockerfile: test-runner.Dockerfile
    container_name: concert-test-runner
    volumes:
      - ./test-scripts:/workspace/test-scripts:ro
    network_mode: "host"
    profiles:
      - testing

networks:
  concert-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
